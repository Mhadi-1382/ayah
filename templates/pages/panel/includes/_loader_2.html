{% load static %}

<style>
    .loader-hide { display: none !important; }
    .loader-container {
        background-color: rgba(240, 248, 255, .6);
        backdrop-filter: blur(4px);
        position: fixed;
        height: 100%;
        width: 100%;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>

<script>
    const loaderContainerId = document.getElementById('loaderContainer');
    setTimeout(() => {
        loaderContainerId.classList.add('loader-hide');
    }, 3000);
</script>
